
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>创作工作台 - VideoPrompt AI Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #333;
      max-width: 1280px;
      margin: 0 auto;
      min-height: 100vh;
      border: 1px solid #d0d0d0;
    }
    .header {
      background: #f5f5f5;
      border-bottom: 1px solid #d0d0d0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .content { padding: 24px; }
    .card { background: #f5f5f5; border: 1px solid #d0d0d0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .text-secondary { color: #888; font-size: 12px; }
    .btn-primary { background: #555; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; text-decoration: none; display: inline-block; }
    .btn-secondary { background: #fff; color: #555; border: 1px solid #aaa; padding: 10px 18px; border-radius: 6px; text-decoration: none; display: inline-block; }
    .nav-link { color: #4a90d9; text-decoration: none; }
    .nav-link:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-dark { background: #555; color: #fff; }
    .badge-light { background: #e8e8e8; color: #333; }
    .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .list { display: grid; gap: 12px; }
    .input-field { width: 100%; border: 1px solid #d0d0d0; border-radius: 6px; padding: 10px 12px; background: #fff; font-size: 14px; margin-top: 6px; }
    textarea.input-field { min-height: 100px; resize: vertical; }
    .placeholder { background: #e0e0e0; border-radius: 6px; color: #888; display: flex; align-items: center; justify-content: center; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .chip { display: inline-block; padding: 4px 8px; border-radius: 999px; border: 1px solid #d0d0d0; background: #fff; font-size: 12px; margin-right: 6px; margin-bottom: 6px; }
    .step { border-left: 3px solid #555; padding-left: 10px; margin-bottom: 12px; }
    .footer-links { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } body { max-width: 100%; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>创作工作台</h1>
    <span class="text-secondary"><a class="nav-link" href="index.html">返回导航</a></span>
  </div>
  <div class="content">
    <div class="grid-2">
      <div>
        <div class="card">
          <div class="section-title">1. 输入创作内容</div>
          <label class="text-secondary">视频主题</label>
          <input class="input-field" value="新品气垫上新，强调轻薄持妆" />
          <label class="text-secondary">卖点脚本</label>
          <textarea class="input-field">镜头1：展示新品包装与核心卖点。镜头2：模特上脸前后对比。镜头3：促销信息与下单引导。</textarea>
          <label class="text-secondary">目标场景</label>
          <div style="margin-top:8px;">
            <span class="chip">新品介绍</span><span class="chip">活动促销</span><span class="chip">图文转视频</span><span class="chip">口播讲解</span>
          </div>
          <div class="toolbar">
            <a class="btn-secondary" href="templates.html">选择模板</a>
            <a class="btn-primary" href="ai-result.html">生成分镜草稿</a>
          </div>
        </div>
        <div class="card">
          <div class="section-title">2. 上传素材</div>
          <div class="placeholder" style="height:160px;">拖拽上传商品图 / Logo / 封面图</div>
          <div class="row" style="margin-top:12px;"><span>已上传 3 张素材</span><span class="text-secondary">jpg/png/webp</span></div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="section-title">项目概要</div>
          <div class="step"><strong>模板建议：</strong> 新品三镜头快闪</div>
          <div class="step"><strong>默认比例：</strong> 9:16 竖屏</div>
          <div class="step"><strong>预计时长：</strong> 18-24 秒</div>
          <div class="step"><strong>风险提示：</strong> 当前缺少封面图，可继续生成后补充</div>
        </div>
        <div class="card">
          <div class="section-title">快捷入口</div>
          <div class="list">
            <a class="nav-link" href="templates.html">查看模板中心</a>
            <a class="nav-link" href="my-prompts.html">查看历史项目</a>
            <a class="nav-link" href="login.html">登录同步项目</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
