
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导出中心 - VideoPrompt AI Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #333;
      max-width: 1280px;
      margin: 0 auto;
      min-height: 100vh;
      border: 1px solid #d0d0d0;
    }
    .header {
      background: #f5f5f5;
      border-bottom: 1px solid #d0d0d0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .content { padding: 24px; }
    .card { background: #f5f5f5; border: 1px solid #d0d0d0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .text-secondary { color: #888; font-size: 12px; }
    .btn-primary { background: #555; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; text-decoration: none; display: inline-block; }
    .btn-secondary { background: #fff; color: #555; border: 1px solid #aaa; padding: 10px 18px; border-radius: 6px; text-decoration: none; display: inline-block; }
    .nav-link { color: #4a90d9; text-decoration: none; }
    .nav-link:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-dark { background: #555; color: #fff; }
    .badge-light { background: #e8e8e8; color: #333; }
    .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .list { display: grid; gap: 12px; }
    .input-field { width: 100%; border: 1px solid #d0d0d0; border-radius: 6px; padding: 10px 12px; background: #fff; font-size: 14px; margin-top: 6px; }
    textarea.input-field { min-height: 100px; resize: vertical; }
    .placeholder { background: #e0e0e0; border-radius: 6px; color: #888; display: flex; align-items: center; justify-content: center; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .chip { display: inline-block; padding: 4px 8px; border-radius: 999px; border: 1px solid #d0d0d0; background: #fff; font-size: 12px; margin-right: 6px; margin-bottom: 6px; }
    .step { border-left: 3px solid #555; padding-left: 10px; margin-bottom: 12px; }
    .footer-links { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
    @media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } body { max-width: 100%; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>导出中心</h1>
    <span class="text-secondary"><a class="nav-link" href="ai-result.html">返回预览</a></span>
  </div>
  <div class="content">
    <div class="grid-2">
      <div>
        <div class="card">
          <div class="section-title">导出参数</div>
          <div class="row" style="margin-bottom:10px;"><span>视频比例</span><span class="badge badge-dark">9:16</span></div>
          <div class="row" style="margin-bottom:10px;"><span>清晰度</span><span>720p / 1080p(Pro)</span></div>
          <div class="row" style="margin-bottom:10px;"><span>字幕</span><span>开启</span></div>
          <div class="row"><span>平台预设</span><span>抖音 / 小红书</span></div>
        </div>
        <div class="card">
          <div class="section-title">导出前校验</div>
          <div class="step"><strong>已通过：</strong> 镜头数、字幕时长、BGM 已配置</div>
          <div class="step"><strong>待补充：</strong> 建议补充封面图以提升发布点击率</div>
          <div class="step"><strong>注意：</strong> 第 3 段字幕接近安全区边界，可在导出后优化</div>
          <div class="toolbar">
            <a class="btn-secondary" href="editor.html">返回修改</a>
            <a class="btn-primary" href="my-prompts.html">确认导出</a>
          </div>
        </div>
      </div>
      <div>
        <div class="card">
          <div class="section-title">平台建议</div>
          <div class="list">
            <div class="card" style="margin-bottom:0;background:#fff;">
              <strong>抖音</strong>
              <p class="text-secondary" style="margin-top:6px;">推荐 18-24 秒，封面标题 8-12 字，首句突出优惠信息。</p>
            </div>
            <div class="card" style="margin-bottom:0;background:#fff;">
              <strong>小红书</strong>
              <p class="text-secondary" style="margin-top:6px;">建议在简介中加入产品使用场景和对比关键词。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
